<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password - PASH.IT</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-body">
  <main class="auth-page">
    <section class="auth-card" style="max-width:420px;margin:60px auto;">
      <h2>Set a new password</h2>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" placeholder="Enter new password" />
      <button class="auth-submit" type="button" onclick="submitNewPassword()">Update password</button>
      <p id="resetMessage" style="margin-top:12px;"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/sb-client.js"></script>
  <script>
    async function submitNewPassword() {
      const password = document.getElementById('newPassword').value;
      const { error } = await sb.auth.updateUser({ password });

      if (error) {
        document.getElementById('resetMessage').textContent = error.message;
        return;
      }
      document.getElementById('resetMessage').textContent = 'Password updated! Redirecting...';
      setTimeout(() => window.location.href = 'login.html', 1500);
    }
  </script>
</body>
</html>
